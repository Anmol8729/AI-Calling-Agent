# Alembic configuration for Clarivo.
#
# Why this exists: the schema used to be maintained by `Base.metadata.create_all`
# plus ~30 hand-written idempotent `ALTER TABLE ... IF NOT EXISTS` statements run at
# every boot. That works, but it has no version history and — critically — **no way
# to roll a change back**. A bad column change on a live customer database could only
# be undone by hand, under pressure.
#
# The database URL is NOT stored here. env.py builds it from the same settings the
# application uses, so there is one source of truth and no credentials in a tracked
# file.

[alembic]
script_location = backend/migrations
prepend_sys_path = .
# UTC, sortable, and the slug keeps filenames readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

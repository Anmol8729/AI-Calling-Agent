# Clarivo — container topology.
#
# What was wrong before (audit C6):
#   * Redis published 6379 to the HOST with NO password. On any box with a public
#     IP that is an open Redis — remote config rewrite and the classic ransomware
#     vector. It only ever needed to be reachable by the API container.
#   * `volumes: [".:/app"]` bind-mounted the whole repo over the image, which
#     shipped the real .env into the running container and meant the code that
#     actually ran was whatever happened to be on the host, not what was built
#     and scanned. That is a dev-only pattern in a file used for deployment.
#   * No healthchecks, so `depends_on` only waited for the process to exist, and
#     an orchestrator had no way to tell a broken container from a starting one.
#
# Redis is included but currently UNUSED by the application (REDIS_URL is read in
# settings.py and referenced nowhere else). It stays because the two open
# scalability items need it — H4 moves rate limiting off in-memory storage, and H3
# moves the notification event bus to pub/sub so more than one replica is safe.
# Until then you can comment this service out entirely.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever REDIS_URL is in .env: inside the compose network the
      # host is the service name, and the password must be included.
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    ports:
      - "8000:8000"
    # No source bind-mount. The image is the artefact; rebuild to deploy changes.
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # /health actually round-trips a DB query, unlike /, so a container that has
      # lost its database reports unhealthy instead of quietly serving errors.
      # Uses python because it is already in the image — no curl to install.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      # Blocks setuid binaries from gaining privileges inside the container.
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # A runaway request or leak takes down this container, not the host.
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----- optional local Postgres, for development without Supabase -----------
  # Behind a PROFILE, so it does not start by default:
  #     docker compose up                          -> api + redis only
  #     docker compose --profile local-db up        -> also starts this
  #
  # Off by default because the application points at Supabase (see DB_HOST in
  # .env), so a container started here would sit idle while looking like the
  # database the app is using — a confusing thing to debug.
  #
  # Three changes from the version this was merged from, all for the same reason
  # the Redis service below is locked down:
  #   * the port binds to 127.0.0.1 only, instead of every interface. Published as
  #     "5432:5432" it was reachable from the network.
  #   * the password is REQUIRED rather than defaulting to "postgres". A weak
  #     default on a reachable port is how databases get taken over.
  #   * a healthcheck, so `depends_on` waits for readiness instead of merely for
  #     the process to exist.
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      # A SEPARATE variable, not DB_USER/DB_PASSWORD. Those hold the Supabase
      # credentials, and feeding the production database password into a local
      # container would put it in the container environment and in `docker inspect`
      # output for no benefit.
      POSTGRES_USER: ${LOCAL_DB_USER:-clarivo}
      # Empty default rather than `:?`. Compose interpolates every variable in the
      # file whether or not the service's profile is selected, so a `:?` guard here
      # would break plain `docker compose up` too. Empty is still safe: the Postgres
      # image refuses to initialise without a password and says so plainly, so this
      # fails loudly the moment someone actually uses the profile — and never
      # silently comes up with a guessable one.
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-}
      POSTGRES_DB: ${LOCAL_DB_NAME:-clarivo}
    ports:
      # Host-only. Change to "5432:5432" only if something off-box must connect,
      # and understand that exposes the database to your network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Deliberately NO `ports:` — reachable only from other services on this
    # network. Publishing it is what made it internet-facing before.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      # Rename the commands that make an accidentally-exposed Redis dangerous.
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      # For redis-cli inside the healthcheck only; not read by the server.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  postgres_data:
